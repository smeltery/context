name: auto-release

# Hab-style auto-release: on green ci on main, cut the next patch tag and
# dispatch release.yml. A tag push made with GITHUB_TOKEN does not start
# release.yml, which is why the dispatch is explicit.
on:
  workflow_run:
    workflows: ["ci"]
    branches: [main]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-main
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  cut-release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Compute next patch tag
        id: version
        run: |
          set -euo pipefail
          git fetch --tags origin
          head="$(git rev-parse HEAD)"
          existing="$(git tag --points-at "$head" 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1 || true)"
          if [ -n "$existing" ]; then
            echo "tag=$existing" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "main already has release tag $existing"
            exit 0
          fi

          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)"
          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            version="${latest#v}"
            major="${version%%.*}"
            rest="${version#*.}"
            minor="${rest%%.*}"
            patch="${version##*.}"
            next="v${major}.${minor}.$((patch + 1))"
          fi

          git tag "$next" "$head"
          git push origin "$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch release build
        if: steps.version.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run release.yml --ref main -f tag="$RELEASE_TAG"

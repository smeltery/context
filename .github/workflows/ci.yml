name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: flox/install-flox-action@v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Prove flox env activates
        run: flox activate -- true

      - name: Markdown and Mermaid
        run: bash scripts/check-docs.sh

      - name: Budgets, shellcheck, and actionlint
        run: flox activate -- bash scripts/check-hygiene.sh

  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: flox/install-flox-action@v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Prove flox env activates
        run: flox activate -- true

      - name: Tests and web build
        run: bash scripts/check-node.sh

  macos:
    name: macos
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Build ContextCore and dock app
        working-directory: macos
        run: |
          set -euo pipefail
          swift build --target ContextCore
          swift build --product Context
          swift build --product ContextCoreSmoke
          swift run ContextCoreSmoke

      - name: XCTest when Xcode is available
        working-directory: macos
        run: |
          set -euo pipefail
          if xcodebuild -version >/dev/null 2>&1; then
            swift test
          else
            echo "Xcode unavailable; ContextCoreSmoke already covered core logic"
          fi

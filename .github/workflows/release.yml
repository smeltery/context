name: release

# auto-release.yml pushes the tag, then dispatches this workflow with that tag.
# A GITHUB_TOKEN tag push does not start another workflow. A tag you push
# yourself still starts this workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v0.1.0
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  preflight:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - uses: flox/install-flox-action@v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Validate release tag
        run: bash scripts/validate-release-tag.sh

      - name: Docs and hygiene
        run: |
          bash scripts/check-docs.sh
          flox activate -- bash scripts/check-hygiene.sh

      - name: Tests and web build
        run: bash scripts/check-node.sh

  build-macos:
    needs: preflight
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Pack release artifacts
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: bash scripts/pack-release.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist-release/

  publish:
    needs: build-macos
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist-release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          test -f dist-release/context-macos-arm64
          test -f "dist-release/context-web-${version}.tar.gz"
          test -f dist-release/SHA256SUMS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist-release/context-macos-arm64 \
              "dist-release/context-web-${version}.tar.gz" \
              dist-release/SHA256SUMS \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist-release/context-macos-arm64 \
              "dist-release/context-web-${version}.tar.gz" \
              dist-release/SHA256SUMS \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --verify-tag
          fi

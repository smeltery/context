<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Context — new identity</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
@font-face{font-family:Inter;src:url('/fonts/inter-latin.woff2')}*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#202124;font-family:Inter,system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:64px 32px}header{display:flex;justify-content:space-between;align-items:center}a{color:inherit}small{font-size:12px;text-transform:uppercase;letter-spacing:.15em;color:#666}h1{font-size:clamp(36px,6vw,68px);letter-spacing:-.06em;font-weight:550;margin:38px 0 18px}p{line-height:1.6;color:#64666b;max-width:520px}.hero{margin:40px 0;min-height:360px;border-radius:28px;background:white;display:flex;align-items:center;justify-content:center;gap:36px}.hero img{width:180px}.wordmark{font-size:clamp(36px,6vw,76px);font-weight:600;letter-spacing:-.065em}.samples{display:grid;grid-template-columns:1fr 1fr;gap:20px}.sample{padding:32px;border-radius:24px;background:#e9e9e9}.dark{background:#242424;color:white}.sizes{display:flex;align-items:center;gap:24px;min-height:108px}.caption{font-size:13px;color:inherit;opacity:.65}.social{width:100%;border-radius:24px;margin-top:24px}@media(max-width:640px){main{padding:32px 20px}.hero{gap:20px;min-height:280px}.hero img{width:100px}.samples{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<header><small>Context / Identity</small><a href="/">View the website ↗</a></header>
<h1>A place for your context.</h1>
<p>A slim edge rail and a tile pulled into reach. Apps, links, and live information, right beside your work.</p>
<section class="hero" aria-label="Context logo"><img src="/icon.svg" alt="White edge rail and offset tile on black"><span class="wordmark">Context</span></section>
<div class="samples">
<section class="sample"><div class="sizes"><img src="/favicon-16.png" width="16" height="16" alt="16 pixel icon"><img src="/favicon-32.png" width="32" height="32" alt="32 pixel icon"><img src="/icon-64.png" width="64" height="64" alt="64 pixel icon"></div><span class="caption">Clear at every size</span></section>
<section class="sample dark"><div class="sizes"><img src="/icon.svg" width="64" height="64" alt="Context"><span style="font-size:32px;letter-spacing:-.04em">Context</span></div><span class="caption">At home on dark backgrounds</span></section>
</div>
<img class="social" src="/og-context.png" alt="Updated Context social sharing card">
</main></body>
</html>
